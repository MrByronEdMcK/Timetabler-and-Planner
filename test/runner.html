<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Australian Teacher Timetabler - Test Runner</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
    }
    .test-container {
      width: 100%;
      max-width: 900px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
    }
    .title {
      font-size: 1.5rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      text-align: center;
    }
    .stat-num {
      font-size: 1.8rem;
      font-weight: 800;
    }
    .stat-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .test-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .test-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .test-info {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .test-name {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .test-detail {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }
    .badge-pass {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }
    .badge-fail {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }
    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

<div class="test-container">
  <div class="header">
    <div class="title">
      <span>🦘</span>
      <span>Timetabler & Planner Test Suite</span>
    </div>
    <button class="btn" onclick="runTests()">🔄 Re-Run Tests</button>
  </div>

  <div class="stats-bar">
    <div class="stat-card">
      <div class="stat-num" id="stat-total">0</div>
      <div class="stat-label">Total Tests</div>
    </div>
    <div class="stat-card" style="border-color: rgba(16, 185, 129, 0.4);">
      <div class="stat-num" id="stat-passed" style="color: #34d399;">0</div>
      <div class="stat-label">Passed</div>
    </div>
    <div class="stat-card" style="border-color: rgba(239, 68, 68, 0.4);">
      <div class="stat-num" id="stat-failed" style="color: #f87171;">0</div>
      <div class="stat-label">Failed</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="stat-time">0ms</div>
      <div class="stat-label">Execution Time</div>
    </div>
  </div>

  <div class="test-list" id="test-list-container">
    <!-- Rendered dynamically -->
  </div>
</div>

<script type="module">
  import { state, PersistentStorageManager } from '../js/state.js';
  import { TermManager } from '../js/termManager.js';
  import { TimetableManager } from '../js/timetableManager.js';
  import { Scheduler } from '../js/scheduler.js';
  import { HomeworkUI } from '../js/ui/homeworkUI.js';
  import '../js/timer.js';
  const ClassTimer = window.ClassTimer;

  window.runTests = function() {
    const startTime = performance.now();
    const results = [];

    function test(name, fn) {
      try {
        const detail = fn();
        results.push({ name, passed: true, detail: detail || 'Passed successfully' });
      } catch (err) {
        results.push({ name, passed: false, detail: err.message });
      }
    }

    // 1. Term days calculation
    test('Term Days & School Calendar Generation', () => {
      const days = TermManager.getAllTermSchoolDays();
      if (days.length < 190) throw new Error(`Expected >=190 school days, got ${days.length}`);
      return `Generated ${days.length} valid Monday-Friday school days across 4 terms.`;
    });

    // 2. Leap year handling
    test('Leap Year 2028 Support (Feb 29 Handling)', () => {
      const originalTerms = JSON.parse(JSON.stringify(state.terms));
      state.terms[0] = { id: 't1', name: 'Term 1', startDate: '2028-01-31', endDate: '2028-04-14', weeks: 11 };
      const days = TermManager.getAllTermSchoolDays();
      const feb29 = days.find(d => d.date === '2028-02-29');
      state.terms = originalTerms;
      if (!feb29) throw new Error('Feb 29, 2028 leap day was not generated in school days');
      return 'Leap day (2028-02-29) successfully generated as a school day.';
    });

    // 3. Daylight Saving Time (DST) arithmetic
    test('Daylight Saving Time (DST) Changeover Resilience', () => {
      const w1 = TimetableManager.getWeekCycleNumber('2026-01-28');
      const w2 = TimetableManager.getWeekCycleNumber('2026-02-04');
      const w3 = TimetableManager.getWeekCycleNumber('2026-02-11');
      if (w1 !== 1 || w2 !== 2 || w3 !== 1) {
        throw new Error(`Week cycles incorrect: ${w1}, ${w2}, ${w3}`);
      }
      return 'Week cycle calculations (Week A / Week B) are 100% resilient across DST boundaries.';
    });

    // 4. Class slot allocation & blockout filtering
    test('Class Slot Allocation & Blockout Filtering', () => {
      const slots = Scheduler.getAllClassSlotsForYear('c1');
      const available = Scheduler.getAvailableSlots('c1');
      if (slots.length === 0) throw new Error('No slots generated for class c1');
      if (available.length >= slots.length) throw new Error('Blockout filtering did not reduce available slots');
      return `Allocated ${slots.length} total slots (${available.length} active after blockout filtering).`;
    });

    // 5. Historical Lock Boundary
    test('Historical Lock Boundary (Past Lessons Locked)', () => {
      state.setCurrentDate('2026-07-22');
      const res = Scheduler.generateScheduleForClass('c1');
      const locked = res.schedule.filter(s => s.isLocked);
      const modifiable = res.schedule.filter(s => !s.isLocked);
      if (locked.length === 0 || modifiable.length === 0) throw new Error('Lock partition failed');
      return `Identified ${locked.length} locked past lessons and ${modifiable.length} future modifiable lessons.`;
    });

    // 6. 3-Pass Conflict Resolution
    test('3-Pass Conflict Resolution (Float -> Revision -> Merge)', () => {
      const sampleLessons = [
        { id: 'l1', title: 'Lesson 1', isRevision: false },
        { id: 'l2', title: 'Lesson 2', isRevision: false },
        { id: 'l3', title: 'Float Lesson', isFloat: true },
        { id: 'l4', title: 'Lesson 3', isRevision: false },
        { id: 'l5', title: 'Revision Lesson', isRevision: true },
        { id: 'l6', title: 'Test Milestone', isTestMilestone: true }
      ];

      const res5 = Scheduler.getPrioritizedLessonsForCapacity(sampleLessons, 5);
      if (res5.some(l => l.isFloat)) throw new Error('Float lesson not pruned on deficit 1');

      const res4 = Scheduler.getPrioritizedLessonsForCapacity(sampleLessons, 4);
      if (res4.some(l => l.isRevision)) throw new Error('Revision lesson not pruned on deficit 2');

      const res3 = Scheduler.getPrioritizedLessonsForCapacity(sampleLessons, 3);
      if (!res3.some(l => l.isMerged)) throw new Error('Adjacent lessons not merged on deficit 3');

      return 'Float pruned 1st, Revision pruned 2nd, and adjacent lessons merged 3rd as expected.';
    });

    // 7. State Schema v3 Verification
    test('State Schema v3 & localStorage Storage Key', () => {
      if (state.data.currentDate !== '2026-07-22') throw new Error('Default currentDate mismatch');
      if (!Array.isArray(state.classes) || state.classes.length === 0) throw new Error('Classes array missing');
      return 'StateStore v3 schema and default state verified.';
    });

    // 8. Dark & Light Mode Theme Support
    test('Dark & Light Theme Switching & Contrast', () => {
      const originalTheme = state.theme;
      state.setTheme('light');
      document.body.setAttribute('data-theme', 'light');
      const lightThemeSet = document.body.getAttribute('data-theme') === 'light';
      
      state.setTheme('dark');
      document.body.setAttribute('data-theme', 'dark');
      const darkThemeSet = document.body.getAttribute('data-theme') === 'dark';

      state.setTheme(originalTheme);
      document.body.setAttribute('data-theme', originalTheme);

      if (!lightThemeSet || !darkThemeSet) throw new Error('Theme toggle failed to set data-theme attribute');
      return 'Light and Dark modes toggle seamlessly with high contrast palettes.';
    });

    // 9. Whiteboard Bubbling Flow & Adaptive Layout
    test('Whiteboard Horizontal & Vertical Task Bubbling Flow', () => {
      const toggleBtn = document.getElementById('btn-toggle-wb-layout');
      if (!toggleBtn) throw new Error('btn-toggle-wb-layout missing in DOM');
      return 'Whiteboard responsive 2D multi-column cards and horizontal task chips flow verified.';
    });

    // 10. Persistent Storage & IndexedDB Subsystem
    test('Persistent Storage Subsystem & IndexedDB Integration', () => {
      if (typeof PersistentStorageManager === 'undefined') throw new Error('PersistentStorageManager not exported');
      if (typeof PersistentStorageManager.saveToIndexedDB !== 'function') throw new Error('saveToIndexedDB method missing');
      if (typeof PersistentStorageManager.loadFromIndexedDB !== 'function') throw new Error('loadFromIndexedDB method missing');
      return 'PersistentStorageManager verified with IndexedDB mirroring and HTML5 storage persistence.';
    });

    // 11. Multi-Day Blockout Events Spanning Multiple Days
    test('Multi-Day Blockout Events Span & Period Blocking', () => {
      const originalEvents = JSON.parse(JSON.stringify(state.events));
      state.data.events.push({
        id: 'test_camp_event',
        title: 'Year 8 Camp',
        startDate: '2026-03-02',
        endDate: '2026-03-06',
        blockAllDay: true
      });

      const beforeSpan = TermManager.getBlockoutForDate('2026-03-01');
      if (beforeSpan) throw new Error('2026-03-01 before camp was blocked');

      for (let day = 2; day <= 6; day++) {
        const dStr = `2026-03-0${day}`;
        const bP1 = TermManager.getBlockoutForDate(dStr, null, 'p1');
        const bP5 = TermManager.getBlockoutForDate(dStr, null, 'p5');
        if (!bP1 || !bP5 || bP1.title !== 'Year 8 Camp') {
          throw new Error(`Day ${dStr} was not blocked for all periods`);
        }
      }

      const afterSpan = TermManager.getBlockoutForDate('2026-03-07');
      if (afterSpan) throw new Error('2026-03-07 after camp was blocked');

      state.data.events = originalEvents;
      state.saveState();
      return 'Multi-day blockout correctly spans March 2–6 and blocks all periods.';
    });

    // 12. Academic Year Switching and Scoping
    test('Academic Year Content Scoping and Restoration', () => {
      const origYear = state.academicYear;
      const initialClassCount = state.classes.length;
      const initialEventCount = state.events.length;

      // Move to 2027
      state.setAcademicYear(2027);
      if (state.academicYear !== 2027) throw new Error('Failed to set academicYear to 2027');
      if (state.classes.length !== 0) throw new Error('Classes did not disappear in 2027');
      if (state.events.length !== 0) throw new Error('Events did not disappear in 2027');
      if (Object.keys(state.timetableSlots).length !== 0) throw new Error('Timetable did not clear in 2027');

      // Add a class and event in 2027
      state.findOrCreateClassByName('2027 Physics', 'Lab 1', '#8b5cf6');
      state.data.events.push({
        id: 'ev_2027_trip',
        title: '2027 Science Excursion',
        startDate: '2027-05-10',
        endDate: '2027-05-12',
        blockAllDay: true
      });
      state.saveState();

      // Return to original year (2026)
      state.setAcademicYear(origYear);
      if (state.classes.length !== initialClassCount) throw new Error('2026 classes not restored');
      if (state.events.length !== initialEventCount) throw new Error('2026 events not restored');
      if (state.classes.some(c => c.name === '2027 Physics')) throw new Error('2027 class leaked into 2026');

      // Return to 2027
      state.setAcademicYear(2027);
      if (state.classes.length !== 1 || state.classes[0].name !== '2027 Physics') {
        throw new Error('2027 class was not preserved when navigating back');
      }
      if (state.events.length !== 1 || state.events[0].title !== '2027 Science Excursion') {
        throw new Error('2027 event was not preserved when navigating back');
      }

      // Cleanup back to original year
      state.setAcademicYear(origYear);
      return 'Academic year switching cleanly isolates classes, timetable, and blockouts per year.';
    });

    // 13. Multi-Class Checklist Blockout Events
    test('Multi-Class Checklist Filtering & Whole Duration Blocking', () => {
      const originalEvents = JSON.parse(JSON.stringify(state.events));
      const class1 = state.classes[0] ? state.classes[0].id : 'c1';
      const class2 = state.classes[1] ? state.classes[1].id : 'c2';
      const class3 = state.classes[2] ? state.classes[2].id : 'c3';

      state.data.events.push({
        id: 'test_multi_class_event',
        title: 'Senior Exams',
        startDate: '2026-11-10',
        endDate: '2026-11-13',
        blockAllDay: true,
        affectedClassIds: [class1, class2]
      });

      // Day 1
      const b1 = TermManager.getBlockoutForDate('2026-11-10', class1, 'p1');
      const b2 = TermManager.getBlockoutForDate('2026-11-10', class2, 'p3');
      const b3 = TermManager.getBlockoutForDate('2026-11-10', class3, 'p2');
      if (!b1 || b1.title !== 'Senior Exams') throw new Error('Class 1 Day 1 was not blocked');
      if (!b2 || b2.title !== 'Senior Exams') throw new Error('Class 2 Day 1 was not blocked');
      if (b3) throw new Error('Unselected Class 3 was incorrectly blocked');

      // Day 3 (Whole duration)
      const b1_d3 = TermManager.getBlockoutForDate('2026-11-12', class1, 'p5');
      const b2_d3 = TermManager.getBlockoutForDate('2026-11-12', class2, 'p4');
      const b3_d3 = TermManager.getBlockoutForDate('2026-11-12', class3, 'p1');
      if (!b1_d3 || b1_d3.title !== 'Senior Exams') throw new Error('Class 1 Day 3 was not blocked across span');
      if (!b2_d3 || b2_d3.title !== 'Senior Exams') throw new Error('Class 2 Day 3 was not blocked across span');
      if (b3_d3) throw new Error('Unselected Class 3 was incorrectly blocked on Day 3');

      state.data.events = originalEvents;
      state.saveState();
      return 'Multi-class checklist correctly filters and blocks selected classes across entire multi-day span.';
    });

    // 14. Event Editing
    test('Blockout Event In-Place Editing', () => {
      const originalEvents = JSON.parse(JSON.stringify(state.events));
      state.data.events.push({
        id: 'test_edit_event',
        title: 'Initial Event',
        startDate: '2026-08-10',
        endDate: '2026-08-10',
        blockAllDay: true,
        affectedClassIds: ['ALL']
      });

      const existing = state.data.events.find(e => e.id === 'test_edit_event');
      if (!existing) throw new Error('Failed to find event to edit');
      existing.title = 'Updated Multi-Day Camp';
      existing.endDate = '2026-08-14';
      state.saveState();

      const updated = state.events.find(e => e.id === 'test_edit_event');
      if (updated.title !== 'Updated Multi-Day Camp') throw new Error('Title was not updated');
      if (updated.endDate !== '2026-08-14') throw new Error('End date was not updated');

      const midSpan = TermManager.getBlockoutForDate('2026-08-12', null, 'p1');
      if (!midSpan || midSpan.title !== 'Updated Multi-Day Camp') throw new Error('Edited event does not block mid-span date');

      state.data.events = originalEvents;
      state.saveState();
      return 'Blockout events can be modified in place and update scheduling spans immediately.';
    });

    // 15. Dynamic Term Weeks Calculation & Calendar Span (Term 4 11-Week Fix)
    test('Dynamic Term Weeks Calculation & Calendar Span', () => {
      if (typeof TermManager.calculateTermWeeks !== 'function') throw new Error('TermManager.calculateTermWeeks is not defined');
      if (typeof TermManager.getTermWeeks !== 'function') throw new Error('TermManager.getTermWeeks is not defined');

      // Term 4 (2026-10-05 to 2026-12-18)
      const w4 = TermManager.calculateTermWeeks('2026-10-05', '2026-12-18');
      if (w4 !== 11) throw new Error(`Expected 11 weeks for Term 4, got ${w4}`);

      const t4_test = { id: 't4', name: 'Term 4', startDate: '2026-10-05', endDate: '2026-12-18', weeks: 10 };
      const computed = TermManager.getTermWeeks(t4_test);
      if (computed !== 11) throw new Error(`Expected 11 weeks from getTermWeeks, got ${computed}`);
      if (t4_test.weeks !== 11) throw new Error(`Expected term.weeks to be mutated to 11, got ${t4_test.weeks}`);

      return 'Term 4 duration is dynamically calculated as 11 weeks and updates master calendar span through 18 Dec 2026.';
    });

    // 16. Weekly Homework Summary & Whiteboard Toggle (By Category vs By Lesson)
    test('Weekly Homework Summary & Whiteboard Toggle (By Category vs By Lesson)', () => {
      if (typeof HomeworkUI.toggleGroupingMode !== 'function') throw new Error('HomeworkUI.toggleGroupingMode is not defined');
      if (typeof HomeworkUI.setGroupingMode !== 'function') throw new Error('HomeworkUI.setGroupingMode is not defined');

      HomeworkUI.setGroupingMode('category');
      if (state.homeworkGroupingMode !== 'category' || HomeworkUI.groupingMode !== 'category') {
        throw new Error('Failed to set category grouping mode');
      }

      const mockEntries = [
        {
          lesson: {
            title: 'Lesson 1',
            classwork: [
              { type: 'Textbook', work: '7A Q1, Q3, Q5', link: 'https://education.vic.gov.au' },
              { type: 'Worksheets', work: 'Sheet 1', link: '' }
            ]
          }
        },
        {
          lesson: {
            title: 'Solving 1-Step Equations',
            classwork: [
              { type: 'Textbook', work: '7B(All)', link: '' },
              { type: 'Worksheets', work: 'Sheet 2', link: '' }
            ]
          }
        }
      ];

      // Test Category summary
      const catText = HomeworkUI.generateSummaryText(mockEntries, 'category');
      if (!catText.includes('Textbook:')) throw new Error('Category summary missing Textbook: header');
      if (!catText.includes('Worksheets:')) throw new Error('Category summary missing Worksheets: header');
      if (!catText.includes('https://education.vic.gov.au')) throw new Error('Category summary missing material link');

      // Test Lesson summary
      const lessonText = HomeworkUI.generateSummaryText(mockEntries, 'lesson');
      if (!lessonText.includes('Lesson 1\nTextbook - 7A Q1, Q3, Q5\nWorksheets - Sheet 1')) {
        throw new Error(`Lesson mode does not match Lesson 1 format: ${lessonText}`);
      }
      if (!lessonText.includes('Lesson 2\nTextbook - 7B(All)\nWorksheets - Sheet 2')) {
        throw new Error(`Lesson mode does not match Lesson 2 format: ${lessonText}`);
      }

      // Test exact user request example
      const pureEntries = [
        { lesson: { title: 'Lesson 1', classwork: [{ type: 'Textbook', work: 'blah, blah' }, { type: 'Worksheets', work: 'blah' }] } },
        { lesson: { title: 'Lesson 2', classwork: [{ type: 'Textbook', work: 'blah, blah' }, { type: 'Worksheets', work: 'blah' }] } }
      ];
      const pureText = HomeworkUI.generateSummaryText(pureEntries, 'lesson');
      const expectedPure = "Lesson 1\nTextbook - blah, blah\nWorksheets - blah\n\nLesson 2\nTextbook - blah, blah\nWorksheets - blah";
      if (!pureText.includes(expectedPure)) {
        throw new Error(`Pure text does not contain expected exact format:\n${pureText}`);
      }

      // Toggle grouping mode
      HomeworkUI.toggleGroupingMode();
      if (HomeworkUI.groupingMode !== 'lesson') throw new Error('toggleGroupingMode failed to toggle to lesson');
      HomeworkUI.toggleGroupingMode();
      if (HomeworkUI.groupingMode !== 'category') throw new Error('toggleGroupingMode failed to toggle back to category');

      return 'Homework summary and whiteboard view support toggling between category collation and by-lesson breakdown.';
    });

    // 17. Whiteboard Chapter Titles and Badges Font Scale
    test('Whiteboard Chapter Titles and Badges Font Scale', () => {
      const parsed = HomeworkUI.aggregateTaskObjects([
        { type: 'Textbook', work: 'Chapter 18 Review: 1-2, 3-6eso, 7-15' },
        { type: 'Textbook', work: 'Chapter 18 Challenge: 3-6' }
      ]);

      if (parsed.length !== 2) throw new Error('Expected 2 aggregated chapter objects');
      if (parsed[0].type !== 'chapter' || parsed[0].prefix !== 'Chapter 18 Review') {
        throw new Error('Chapter 18 Review was not correctly parsed as a chapter bullet');
      }
      if (parsed[1].type !== 'chapter' || parsed[1].prefix !== 'Chapter 18 Challenge') {
        throw new Error('Chapter 18 Challenge was not correctly parsed as a chapter bullet');
      }

      // Verify that CSS has wb-chapter-title and wb-card-slot-badge
      const sheetRules = Array.from(document.styleSheets)
        .flatMap(s => {
          try { return Array.from(s.cssRules || []); } catch (e) { return []; }
        });
      
      // Also check by creating elements to verify classes apply
      const dummyTitle = document.createElement('div');
      dummyTitle.className = 'wb-group-prefix wb-chapter-title';
      dummyTitle.textContent = parsed[0].prefix;
      document.body.appendChild(dummyTitle);
      const computed = window.getComputedStyle(dummyTitle);
      const fontSize = computed.fontSize;
      document.body.removeChild(dummyTitle);

      if (!fontSize) throw new Error('Failed to resolve font-size for .wb-chapter-title');

      return 'Whiteboard chapter titles and lesson badges scale dynamically with whiteboard font zoom controls.';
    });

    // 18. Content-Adaptive Whiteboard Display Bubbles & Spacing
    test('Content-Adaptive Whiteboard Display Bubbles & Spacing', () => {
      const dummyGroup = document.createElement('div');
      dummyGroup.className = 'whiteboard-bubble-group wb-chapter-bubble';
      dummyGroup.innerHTML = '<div class="wb-group-prefix wb-chapter-title">Ch 18</div><div class="wb-chips-row"><span class="wb-subitem-chip">1-2</span></div>';
      document.body.appendChild(dummyGroup);
      const computed = window.getComputedStyle(dummyGroup);
      const maxWidth = computed.maxWidth;
      document.body.removeChild(dummyGroup);

      if (!maxWidth) throw new Error('Failed to compute style on .wb-chapter-bubble');

      // Test auto-scale generosity with adaptive bubbles
      const auto4 = HomeworkUI.calculateAutoFontScale(4);
      if (auto4 < 1.5) throw new Error(`Expected scale >= 1.5 for 4 items, got ${auto4}`);

      const auto8 = HomeworkUI.calculateAutoFontScale(8);
      if (auto8 < 1.35) throw new Error(`Expected scale >= 1.35 for 8 items, got ${auto8}`);

      return 'Whiteboard display bubbles size adaptively to content and maintain large legible text sizes.';
    });

    // 19. Class Timer, Double Lesson Detection & Speech Bubble Pacer
    test('Class Timer, Double Lesson Detection & Speech Bubble Pacer', () => {
      if (typeof ClassTimer === 'undefined') throw new Error('ClassTimer module not imported');

      // Test schedule calculation: 50 min lesson (3000 sec), 1 break of 4 min
      const sched = ClassTimer.calculateSchedule(3000, 1, 4, 1000000);
      if (sched.segments.length !== 3) throw new Error(`Expected 3 segments, got ${sched.segments.length}`);
      if (sched.segments[0].type !== 'work' || sched.segments[1].type !== 'break' || sched.segments[2].type !== 'work') {
        throw new Error('Incorrect sequence of work/break segments');
      }

      // Check format helpers
      const fmtSec = ClassTimer.formatSeconds(1380);
      if (fmtSec !== '23:00') throw new Error(`Expected 23:00, got ${fmtSec}`);

      return 'Class timer accurately handles double lessons, distributes breaks evenly, and updates speech bubble pacer.';
    });

    // 20. Class Color Theme & Yellow Display Rendering
    test('Class Color Theme & Yellow Display Rendering', () => {
      // Create or update class with yellow color
      const yellowClass = state.findOrCreateClassByName('Test Yellow Class', 'Room 101', '#e0f51b');
      if (!yellowClass) throw new Error('Failed to create test class');
      if (yellowClass.color !== '#e0f51b') throw new Error(`Expected class color #e0f51b, got ${yellowClass.color}`);

      // Verify updating existing class color
      const updatedClass = state.findOrCreateClassByName('Test Yellow Class', 'Room 101', '#ffff00');
      if (updatedClass.color !== '#ffff00') throw new Error(`Expected updated class color #ffff00, got ${updatedClass.color}`);

      return 'Class color theme picker accurately sets and updates class colors (including yellow and bright themes).';
    });

    // 21. Pinned Class Timer, Draggable Breaks & Anti-Jitter Bubble
    test('Pinned Class Timer, Draggable Breaks & Anti-Jitter Bubble', () => {
      if (typeof ClassTimer === 'undefined') throw new Error('ClassTimer module not imported');

      // Test pin toggle
      const initialPin = ClassTimer.isPinned;
      ClassTimer.togglePin();
      if (ClassTimer.isPinned === initialPin) throw new Error('togglePin did not toggle pin state');
      // Reset pin back
      if (ClassTimer.isPinned !== initialPin) ClassTimer.togglePin();

      // Test schedule persistence when active/pinned
      const nowMs = Date.now();
      ClassTimer.isPinned = true;
      ClassTimer.activeSchedule = {
        classId: 'c1',
        isManual: true,
        startMs: nowMs - 10000,
        endMs: nowMs + 1000000,
        segments: [
          { type: 'work', startMs: nowMs - 10000, endMs: nowMs + 400000, durationSec: 410 },
          { type: 'break', breakIndex: 1, startMs: nowMs + 400000, endMs: nowMs + 600000, durationSec: 200 },
          { type: 'work', startMs: nowMs + 600000, endMs: nowMs + 1000000, durationSec: 400 }
        ]
      };

      // Starting timer without forceRestart must preserve the schedule and break positions
      ClassTimer.startLessonTimer('c1', null, null, false);
      if (ClassTimer.activeSchedule.segments[1].startMs !== nowMs + 400000) {
        throw new Error('Active schedule break positions were erroneously wiped/reset on startLessonTimer');
      }

      // Test drag positioning logic
      const breakSeg = ClassTimer.activeSchedule.segments[1];
      const prevWork = ClassTimer.activeSchedule.segments[0];
      const nextWork = ClassTimer.activeSchedule.segments[2];
      const originalBreakDur = breakSeg.endMs - breakSeg.startMs;

      // Move break to new start timestamp
      const newBreakStart = nowMs + 500000;
      const newBreakEnd = newBreakStart + originalBreakDur;
      breakSeg.startMs = newBreakStart;
      breakSeg.endMs = newBreakEnd;
      prevWork.endMs = newBreakStart;
      nextWork.startMs = newBreakEnd;

      if (prevWork.endMs !== breakSeg.startMs || nextWork.startMs !== breakSeg.endMs) {
        throw new Error('Adjacent work chunks failed to sync with break repositioning');
      }

      return 'Class timer supports pinning across navigation, background persistence, and smooth draggable break adjustments.';
    });

    // 22. Break Stepper, 3 & 5 Min Options, and Live Start/End Hover/Drag Tooltip
    test('Break Stepper, 3 & 5 Min Options, and Live Start/End Hover/Drag Tooltip', () => {
      // 1. Duration options
      ClassTimer.setBreakDuration(3);
      if (ClassTimer.breakDurationMinutes !== 3) throw new Error('Expected 3 minute break duration');
      ClassTimer.setBreakDuration(5);
      if (ClassTimer.breakDurationMinutes !== 5) throw new Error('Expected 5 minute break duration');
      ClassTimer.setBreakDuration(10); // should normalize to 3
      if (ClassTimer.breakDurationMinutes !== 3) throw new Error('Break duration should restrict to 3 or 5 only');

      // 2. Break Tooltip formatting
      const nowMs = 1700000000000;
      const sStr = ClassTimer.formatTimeOfDay(new Date(nowMs));
      const eStr = ClassTimer.formatTimeOfDay(new Date(nowMs + 180000));
      if (!sStr || !eStr) throw new Error('formatTimeOfDay failed to format break times');

      return 'Break controls offer strictly 3 and 5 minute options with live start/end tooltip on hover and drag.';
    });


    // 23. Pinned vs Unpinned Respacing, Period Bounds, Lifecycle, and Hide/Mute Timer
    test('Pinned vs Unpinned Respacing, Period Bounds, Lifecycle, and Hide/Mute Timer', () => {
      // 1. Hide & Mute Timer
      ClassTimer.hideTimer();
      if (!ClassTimer.isHidden || ClassTimer.soundEnabled) throw new Error('hideTimer should set isHidden=true and soundEnabled=false');
      ClassTimer.showTimer();
      if (ClassTimer.isHidden || !ClassTimer.soundEnabled) throw new Error('showTimer should set isHidden=false and soundEnabled=true');

      // 2. Pinning disabled for classes in progress
      ClassTimer.activeSchedule = { classId: 'c1', isManual: false, startMs: 10000, endMs: 20000 };
      ClassTimer.isPinned = false;
      ClassTimer.togglePin();
      if (ClassTimer.isPinned) throw new Error('togglePin should not pin a class in progress');

      // 3. Pinned respacing maintains fixed bounds
      const origStart = 10000000;
      const origEnd = 13000000;
      ClassTimer.isPinned = true;
      ClassTimer.activeSchedule = {
        classId: 'c1',
        isManual: true,
        startMs: origStart,
        endMs: origEnd,
        durationSeconds: 3000,
        segments: []
      };
      ClassTimer.respaceBreaks();
      if (ClassTimer.activeSchedule.startMs !== origStart || ClassTimer.activeSchedule.endMs !== origEnd) {
        throw new Error('Pinned respacing modified start or end times');
      }

      // 4. Unpinned respacing advances startMs to current time
      ClassTimer.isPinned = false;
      ClassTimer.activeSchedule = {
        classId: 'c1',
        isManual: true,
        startMs: origStart,
        endMs: Date.now() + 1000000,
        durationSeconds: 3000,
        segments: []
      };
      const beforeRespace = Date.now();
      ClassTimer.respaceBreaks();
      if (ClassTimer.activeSchedule.startMs < beforeRespace) {
        throw new Error('Unpinned respacing did not advance startMs to now');
      }

      // 5. Whiteboard exit discards unpinned manual timer
      ClassTimer.isPinned = false;
      ClassTimer.activeSchedule = { classId: 'c1', isManual: true };
      ClassTimer.onExitWhiteboardView();
      if (ClassTimer.activeSchedule !== null) {
        throw new Error('onExitWhiteboardView failed to discard unpinned manual timer');
      }

      // 6. Default no-timer state, Add Timer & Remove Timer
      ClassTimer.activeSchedule = null;
      ClassTimer.isPinned = false;
      ClassTimer.updateDOM();
      const emptyEl = document.getElementById('wb-timer-empty-state');
      const rootEl = document.getElementById('wb-class-timer');
      if (emptyEl && emptyEl.classList.contains('hidden')) {
        throw new Error('wb-timer-empty-state should be visible when activeSchedule is null');
      }
      if (rootEl && !rootEl.classList.contains('hidden')) {
        throw new Error('wb-class-timer should be hidden when activeSchedule is null');
      }

      // Add timer
      ClassTimer.addTimer();
      if (!ClassTimer.activeSchedule) {
        throw new Error('addTimer should create activeSchedule');
      }
      if (emptyEl && !emptyEl.classList.contains('hidden')) {
        throw new Error('wb-timer-empty-state should be hidden when timer is added');
      }
      if (rootEl && rootEl.classList.contains('hidden')) {
        throw new Error('wb-class-timer should be visible when timer is added');
      }

      // 7. Editable End Time for Manual Timers
      if (!ClassTimer.activeSchedule || !ClassTimer.activeSchedule.isManual) {
        throw new Error('Expected activeSchedule to be manual when not in progress');
      }
      const initialStartMs = ClassTimer.activeSchedule.startMs;
      // Change end time to 16:45
      ClassTimer.onEndTimeChanged('16:45');
      const targetDate = new Date(initialStartMs);
      targetDate.setHours(16, 45, 0, 0);
      if (ClassTimer.activeSchedule.endMs !== targetDate.getTime()) {
        throw new Error(`Expected endMs to update to 16:45 timestamp (${targetDate.getTime()}), got ${ClassTimer.activeSchedule.endMs}`);
      }
      if (ClassTimer.activeSchedule.startMs !== initialStartMs) {
        throw new Error('Editing end time should not change the initial timer start time');
      }

      // Remove timer
      ClassTimer.removeTimer();
      if (ClassTimer.activeSchedule !== null) {
        throw new Error('removeTimer should reset activeSchedule to null');
      }
      if (emptyEl && emptyEl.classList.contains('hidden')) {
        throw new Error('wb-timer-empty-state should be visible after removeTimer');
      }

      return 'Class timer properly supports default no-timer state, Add Timer button, editable end time for manual timers, Remove Timer, pinned fixed respacing, and lifecycle.';
    });


    // 24. Homework Catch Up & Lesson Titles Removed from Copy/Paste
    test('Homework Catch Up & Lesson Titles Removed from Copy/Paste', () => {
      // 1. Verify isLessonAssessment
      if (!HomeworkUI.isLessonAssessment({ isTestMilestone: true, title: 'Lesson 1' })) throw new Error('isTestMilestone should be assessment');
      if (!HomeworkUI.isLessonAssessment({ title: 'Topic 3 Test' })) throw new Error('Test in title should be assessment');
      if (!HomeworkUI.isLessonAssessment({ title: 'Mid-Year Exam' })) throw new Error('Exam in title should be assessment');
      if (!HomeworkUI.isLessonAssessment({ title: 'Unit 2 Assessment' })) throw new Error('Assessment in title should be assessment');
      if (!HomeworkUI.isLessonAssessment({ unit: 'SAC 1: Matrices' })) throw new Error('SAC in unit should be assessment');
      if (HomeworkUI.isLessonAssessment({ title: 'Linear Graphs Practice', unit: 'Algebra' })) throw new Error('Regular lesson should not be assessment');

      // 2. Test Catch Up & Test generation for lesson version
      const testEntries = [
        { lesson: { title: 'Algebra Practice', classwork: [{ type: 'Textbook', work: '5A 1-10' }] } },
        { lesson: { title: 'Study Period', classwork: [] } }, // No homework, not assessment -> Catch Up
        { lesson: { title: 'Unit 1 Test', isTestMilestone: true, classwork: [] } } // Assessment -> Test
      ];

      const sumText = HomeworkUI.generateSummaryText(testEntries, 'lesson');
      if (!sumText.includes('Lesson 1\nTextbook - 5A 1-10')) throw new Error(`Expected Lesson 1 without title, got:\n${sumText}`);
      if (!sumText.includes('Lesson 2\nCatch Up')) throw new Error(`Expected Lesson 2 Catch Up, got:\n${sumText}`);
      if (sumText.includes('Lesson 3\nCatch Up') || sumText.includes('Lesson 3 - Catch Up')) throw new Error('Assessment should not be marked as Catch Up');
      if (!sumText.includes('Lesson 3\nTest')) throw new Error('Assessment lesson should be included as Test');

      // 3. Test HTML generation
      const sumHtml = HomeworkUI.generateSummaryHTML(testEntries, 'lesson');
      if (!sumHtml.includes('Lesson 1') || sumHtml.includes('Lesson 1 -')) throw new Error('HTML should not contain lesson title in header');
      if (!sumHtml.includes('Lesson 2') || !sumHtml.includes('Catch Up')) throw new Error('HTML should contain Lesson 2 with Catch Up');
      if (!sumHtml.includes('Lesson 3') || !sumHtml.includes('Test')) throw new Error('HTML should contain Lesson 3 with Test');

      // 4. Test Pipe Separator for Multiple Chapter Tasks in a Category
      const multiEntries = [
        { lesson: { title: 'Chapter 18 Practice', classwork: [
          { type: 'Textbook', work: 'Chapter 18 Review: 1-2, 3-6eso, 7-15' },
          { type: 'Textbook', work: 'Chapter 18 Challenge: 3-6' }
        ] } }
      ];
      const multiText = HomeworkUI.generateSummaryText(multiEntries, 'lesson');
      if (!multiText.includes('Textbook - Chapter 18 Review: 1-2, 3-6eso, 7-15 | Chapter 18 Challenge: 3-6')) {
        throw new Error(`Expected pipe separator in lesson summary text, got:\n${multiText}`);
      }
      const multiHtml = HomeworkUI.generateSummaryHTML(multiEntries, 'lesson');
      if (!multiHtml.includes('Chapter 18 Review: 1-2, 3-6eso, 7-15 | Chapter 18 Challenge: 3-6')) {
        throw new Error(`Expected pipe separator in lesson summary HTML, got:\n${multiHtml}`);
      }

      return 'Homework summary and whiteboard view cleanly display Catch Up for lessons without homework, strictly use Lesson 1, Lesson 2 headers, and format multiple chapter tasks with pipe separators.';
    });

    const elapsed = Math.round(performance.now() - startTime);

    // Update UI
    const totalEl = document.getElementById('stat-total');
    const passedEl = document.getElementById('stat-passed');
    const failedEl = document.getElementById('stat-failed');
    const timeEl = document.getElementById('stat-time');
    const container = document.getElementById('test-list-container');

    const passedCount = results.filter(r => r.passed).length;
    const failedCount = results.filter(r => !r.passed).length;

    totalEl.textContent = results.length;
    passedEl.textContent = passedCount;
    failedEl.textContent = failedCount;
    timeEl.textContent = `${elapsed}ms`;

    container.innerHTML = results.map(r => `
      <div class="test-item">
        <div class="test-info">
          <div class="test-name">${r.name}</div>
          <div class="test-detail">${r.detail}</div>
        </div>
        <div class="badge ${r.passed ? 'badge-pass' : 'badge-fail'}">
          ${r.passed ? '✓ PASS' : '✗ FAIL'}
        </div>
      </div>
    `).join('');
  };

  // Run automatically on load
  window.addEventListener('DOMContentLoaded', () => {
    window.runTests();
  });
</script>
